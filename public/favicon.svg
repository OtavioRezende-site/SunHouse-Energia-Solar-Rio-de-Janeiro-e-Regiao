<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fav-sun-grad" x1="16" y1="8" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FBBF24" />
      <stop offset="50%" stopColor="#F59E0B" />
      <stop offset="100%" stopColor="#EA580C" />
    </linearGradient>
  </defs>

  <!-- Base contrastada para abas claras e escuras -->
  <rect width="64" height="64" rx="14" fill="#071C45" />

  <!-- Raios Solares -->
  <path d="M 32 6 L 32 2" stroke="url(#fav-sun-grad)" stroke-width="3" stroke-linecap="round" />
  <path d="M 17 11 L 14 8" stroke="url(#fav-sun-grad)" stroke-width="3" stroke-linecap="round" />
  <path d="M 47 11 L 50 8" stroke="url(#fav-sun-grad)" stroke-width="3" stroke-linecap="round" />
  <path d="M 9 24 L 5 24" stroke="url(#fav-sun-grad)" stroke-width="3" stroke-linecap="round" />
  <path d="M 55 24 L 59 24" stroke="url(#fav-sun-grad)" stroke-width="3" stroke-linecap="round" />

  <!-- Sol Nascente -->
  <circle cx="32" cy="27" r="14" fill="url(#fav-sun-grad)" />

  <!-- Telhado Fotovoltaico Técnico -->
  <path
    d="M 10 44 L 32 22 L 54 44 L 49 48 L 32 32 L 15 48 Z"
    fill="#023399"
  />

  <path
    d="M 15 48 L 32 32 L 49 48 L 46 53 L 32 41 L 18 53 Z"
    fill="url(#fav-sun-grad)"
  />

  <!-- Grid fotovoltaico -->
  <line x1="32" y1="23" x2="32" y2="54" stroke="#FFFFFF" stroke-width="1.8" stroke-opacity="0.9" />
  <line x1="23" y1="33" x2="23" y2="50" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.4" />
  <line x1="41" y1="33" x2="41" y2="50" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.4" />
  <line x1="16" y1="43" x2="48" y2="43" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.4" />

  <!-- Ponto Solar no Vértice -->
  <circle cx="32" cy="22" r="3" fill="#FBBF24" />
</svg>
